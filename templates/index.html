<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 数据分析</title>
    <script src="https://lib.baomitu.com/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; transition: background 0.3s, color 0.3s; }
        body.light { background: #f5f5f5; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; padding: 30px 0 20px; font-size: 28px; }
        h1 span { color: #ff0000; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; z-index: 100; background: #2a2a2a; border: none; color: #fff; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        body.light .theme-toggle { background: #e0e0e0; color: #333; }
        .search-panel { background: #1a1a1a; border-radius: 12px; padding: 24px; margin-bottom: 24px; transition: background 0.3s; }
        body.light .search-panel { background: #fff; border: 1px solid #e0e0e0; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab { padding: 10px 20px; background: #2a2a2a; border: none; color: #aaa; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .tab.active { background: #ff0000; color: #fff; }
        body.light .tab { background: #f0f0f0; color: #666; }
        body.light .tab.active { background: #ff0000; color: #fff; }
        .tab:hover:not(.active) { background: #333; }
        body.light .tab:hover:not(.active) { background: #e0e0e0; }
        .form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
        .input-group { flex: 1; min-width: 200px; }
        label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 12px 16px; background: #2a2a2a; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 14px; }
        body.light input, body.light select { background: #f5f5f5; border-color: #ddd; color: #333; }
        input:focus, select:focus { outline: none; border-color: #ff0000; }
        input::placeholder { color: #666; }
        .btn-search { padding: 12px 32px; background: #ff0000; border: none; color: #fff; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        .btn-search:hover { background: #cc0000; }
        .btn-search:disabled { background: #666; cursor: not-allowed; }
        .history-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid #333; }
        body.light .history-section { border-color: #e0e0e0; }
        .history-label { font-size: 12px; color: #666; margin-bottom: 8px; }
        .history-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .history-tag { background: #2a2a2a; color: #aaa; padding: 4px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
        body.light .history-tag { background: #f0f0f0; color: #666; }
        .history-tag:hover { background: #ff0000; color: #fff; }
        .history-clear { background: none; border: none; color: #666; font-size: 12px; cursor: pointer; margin-left: auto; }
        .history-clear:hover { color: #ff0000; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: #1a1a1a; border-radius: 12px; padding: 20px; text-align: center; transition: background 0.3s; }
        body.light .stat-card { background: #fff; border: 1px solid #e0e0e0; }
        .stat-value { font-size: 32px; font-weight: bold; color: #ff0000; }
        .stat-label { font-size: 12px; color: #888; margin-top: 8px; text-transform: uppercase; }
        .chart-section { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 24px; }
        @media (max-width: 768px) { .chart-section { grid-template-columns: 1fr; } }
        .chart-card { background: #1a1a1a; border-radius: 12px; padding: 20px; transition: background 0.3s; }
        body.light .chart-card { background: #fff; border: 1px solid #e0e0e0; }
        .chart-card h3 { margin-bottom: 16px; font-size: 16px; color: #ccc; }
        body.light .chart-card h3 { color: #333; }
        .chart-container { position: relative; height: 300px; }
        .tag-cloud { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0; }
        .tag { background: #2a2a2a; color: #ccc; padding: 6px 14px; border-radius: 20px; font-size: 13px; transition: all 0.2s; }
        body.light .tag { background: #f0f0f0; color: #666; }
        .tag:hover { background: #ff0000; color: #fff; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .video-card { background: #1a1a1a; border-radius: 12px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; text-decoration: none; color: inherit; display: block; }
        body.light .video-card { background: #fff; border: 1px solid #e0e0e0; }
        .video-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(255,0,0,0.2); }
        .video-thumb { position: relative; padding-top: 56.25%; }
        .video-thumb img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .video-info { padding: 12px; }
        .video-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .video-channel { font-size: 12px; color: #888; margin-bottom: 8px; }
        .video-stats { display: flex; gap: 16px; font-size: 12px; color: #aaa; }
        .video-stats span { display: flex; align-items: center; gap: 4px; }
        .toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .btn-tool { padding: 8px 16px; background: #2a2a2a; border: none; color: #ccc; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        body.light .btn-tool { background: #f0f0f0; color: #666; }
        .btn-tool:hover { background: #ff0000; color: #fff; }
        .loading { text-align: center; padding: 40px; color: #888; }
        .loading::after { content: ''; animation: dots 1.5s infinite; }
        @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
        .empty { text-align: center; padding: 60px 20px; color: #666; }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .hidden { display: none; }
        /* New styles for comparison and history dashboard */
        .comparison-panel { background: #1a1a1a; border-radius: 12px; padding: 24px; margin-bottom: 24px; transition: background 0.3s; }
        body.light .comparison-panel { background: #fff; border: 1px solid #e0e0e0; }
        .history-dashboard { background: #1a1a1a; border-radius: 12px; padding: 24px; margin-bottom: 24px; transition: background 0.3s; }
        body.light .history-dashboard { background: #fff; border: 1px solid #e0e0e0; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #2a2a2a; border-radius: 8px; margin-bottom: 8px; }
        body.light .history-item { background: #f5f5f5; }
        .history-item:hover { background: #333; }
        body.light .history-item:hover { background: #e0e0e0; }
        .comparison-result { background: #1a1a1a; border-radius: 12px; padding: 24px; margin-top: 24px; transition: background 0.3s; }
        body.light .comparison-result { background: #fff; border: 1px solid #e0e0e0; }
        .quota-bar { height: 8px; background: #2a2a2a; border-radius: 4px; overflow: hidden; margin-top: 8px; }
        body.light .quota-bar { background: #e0e0e0; }
        .quota-fill { height: 100%; background: #ff0000; transition: width 0.3s; }
        .quota-fill.warning { background: #ff6b6b; }
        .quota-fill.danger { background: #dc2626; }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; }
        .alert-warning { background: #fef3c7; color: #92400e; }
        body.light .alert-warning { background: #fef3c7; }
        .alert-error { background: #fee2e2; color: #991b1b; }
        .batch-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .batch-table th, .batch-table td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        body.light .batch-table th, body.light .batch-table td { border-color: #e0e0e0; }
        .batch-table th { background: #2a2a2a; color: #ff0000; font-size: 12px; text-transform: uppercase; }
        body.light .batch-table th { background: #f5f5f5; }
        .batch-table tr:hover { background: #1a1a1a; }
        body.light .batch-table tr:hover { background: #f0f0f0; }
        .rank-badge { display: inline-block; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%; background: #ff0000; color: #fff; font-size: 12px; font-weight: bold; }
        .heat-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:2px; margin-top:8px; }
        .heat-cell { aspect-ratio:1; border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; font-weight:bold; }
        .detail-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:20px; }
        .detail-card { background:#1a1a1a; border-radius:10px; padding:14px; text-align:center; }
        body.light .detail-card { background:#fff; border:1px solid #e0e0e0; }
        .detail-val { font-size:22px; font-weight:bold; color:#ff0000; }
        .detail-lbl { font-size:11px; color:#888; margin-top:4px; text-transform:uppercase; }
        .tag-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
        .mini-tag { background:#2a2a2a; color:#aaa; padding:3px 10px; border-radius:10px; font-size:11px; }
        body.light .mini-tag { background:#f0f0f0; color:#666; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">🌙 主题</button>
    <div class="container">
        <h1>📊 YouTube <span>数据分析</span></h1>
        <div class="search-panel"><div class="tabs">
                <button class="tab active" onclick="switchTab(this, 'keywords')">关键词搜索</button>
                <button class="tab" onclick="switchTab(this, 'channel')">频道分析</button>
                <button class="tab" onclick="switchTab(this, 'batch')">批量扫描</button>
                <button class="tab" onclick="switchTab(this, 'hot')">热门类别</button>
                <button class="tab" onclick="switchTab(this, 'feature')">特征分析</button>
                <button class="tab" onclick="switchTab(this, 'deep')">深度分析</button>    <button class="tab" onclick="switchTab(this, 'trend')">趋势追踪</button>
                <button class="tab" onclick="switchTab(this, 'discover')">机会挖掘</button>
            </div>
            <div id="keywords-panel">    <div class="form-row">        <div class="input-group" style="flex: 2;"><label>搜索关键词</label><input type="text" id="keywords" placeholder="例如: AI, Python教程, 科技新闻">        </div>        <div class="input-group"><label>时间范围</label><select id="time-range">    <option value="today">今天</option>    <option value="this_week">本周</option>    <option value="this_month" selected>本月</option>    <option value="past_year">过去一年</option></select>        </div>    </div>    <div class="form-row">        <div class="input-group"><label>排序方式</label><select id="sort-order">    <option value="relevance">相关性</option>    <option value="date">发布时间</option>    <option value="viewCount" selected>播放量</option>    <option value="velocity">播放速度</option>    <option value="rating">评分</option></select>        </div>        <div class="input-group"><label>结果数量</label><select id="max-results">    <option value="10">10</option>    <option value="20" selected>20</option>    <option value="30">30</option>    <option value="50">50</option></select>        </div>        <div class="input-group" style="flex: 0 0 auto; display: flex; align-items: flex-end;"><button class="btn-search" onclick="searchTrends()">🔍 搜索</button>        </div>    </div>    <div class="history-section" id="history-section" style="display: none;">        <div style="display: flex; justify-content: space-between; align-items: center;"><span class="history-label">最近搜索</span><button class="history-clear" onclick="clearHistory()">清除历史</button>        </div>        <div class="history-tags" id="history-tags"></div>    </div></div><div id="channel-panel" class="hidden">    <div class="form-row">        <div class="input-group" style="flex: 2;"><label>频道 ID 或 URL</label><input type="text" id="channel-input" placeholder="例如: UCXuqS4H64fpLVoXrLhKyQQg 或 https://youtube.com/channel/UC...">        </div>        <div class="input-group"><label>时间范围</label><select id="channel-time-range">    <option value="past_year" selected>过去一年</option>    <option value="this_month">本月</option>    <option value="this_week">本周</option></select>        </div>        <div class="input-group"><label>排序方式</label><select id="channel-sort">    <option value="date" selected>发布时间</option>    <option value="viewCount">播放量</option>    <option value="velocity">播放速度</option>    <option value="rating">评分</option></select>        </div>        <div class="input-group" style="flex: 0 0 auto; display: flex; align-items: flex-end;"><button class="btn-search" onclick="searchChannel()">📊 分析</button>        </div>    </div><div class="form-row" style="margin-top:4px;"><div class="input-group" style="flex:2;"><label>不知道 ID？按名称搜频道</label><input type="text" id="channel-search-input" placeholder="例如: MrBeast"></div><div class="input-group" style="flex:0 0 auto; display:flex; align-items:flex-end;"><button class="btn-tool" onclick="searchChannels()">🔎 搜频道</button></div></div><div id="channel-search-results" class="hidden" style="margin-top:8px;"></div></div>
        <div id="batch-panel" class="hidden"><div class="form-row">    <div class="input-group" style="flex: 3;">        <label>关键词列表（逗号分隔）</label>        <input type="text" id="batch-keywords" placeholder="例如: 健身, 烹饪, 科技, 游戏, 美食, 搞笑">    </div>    <div class="input-group" style="flex: 1;">        <label>时间范围</label>        <select id="batch-time-range"><option value="this_week">本周</option><option value="this_month" selected>本月</option><option value="past_year">过去一年</option>        </select>    </div>    <div class="input-group" style="flex: 1;">        <label>每个关键词结果数</label>        <select id="batch-max-results"><option value="10">10</option><option value="20" selected>20</option><option value="30">30</option>        </select>    </div></div><div class="form-row">    <div class="input-group" style="flex: 0 0 auto;">        <button class="btn-search" onclick="batchScan()">📊 开始扫描</button>    </div></div><div id="batch-scan-results" class="hidden" style="margin-top: 24px;">    <h2 style="margin-bottom: 16px; font-size: 18px;">📊 批量扫描结果</h2>    <div id="batch-table" style="margin-top: 20px;"></div></div>
        </div>
        <div id="hot-panel" class="hidden"><div class="form-row">    <div class="input-group">        <label>时间范围</label>        <select id="hot-time-range"><option value="this_week">本周</option><option value="this_month" selected>本月</option><option value="past_year">过去一年</option>        </select>    </div>    <div class="input-group">        <label>显示类别数</label>        <select id="hot-max-count"><option value="10" selected>10</option><option value="15">15</option><option value="20">20</option>        </select>    </div>    <div class="input-group" style="flex: 0 0 auto;">        <button class="btn-search" onclick="loadHotCategories()">📊 扫描类别</button>    </div></div><div id="hot-results" class="hidden" style="margin-top: 24px;">    <h2 style="margin-bottom: 16px; font-size: 18px;">🏆 热门 Shorts 类别排名</h2>    <div class="chart-card">        <div class="chart-container" style="height: 400px;"><canvas id="hot-chart"></canvas>        </div>    </div>    <div id="hot-table" style="margin-top: 20px;"></div></div>
        </div>
        <div id="feature-panel" class="hidden"><div class="form-row">    <div class="input-group" style="flex: 2;">        <label>分析关键词</label>        <input type="text" id="feature-keyword" placeholder="例如: AI">    </div>    <div class="input-group" style="flex: 1;">        <label>时间范围</label>        <select id="feature-time-range"><option value="this_week">本周</option><option value="this_month" selected>本月</option><option value="past_year">过去一年</option>        </select>    </div>    <div class="input-group" style="flex: 1;">        <label>分析视频数</label>        <select id="feature-max-results"><option value="10">10</option><option value="20" selected>20</option><option value="30">30</option>        </select>    </div></div><div class="form-row">    <div class="input-group" style="flex: 0 0 auto;">        <button class="btn-search" onclick="analyzeFeatures()">🔍 分析特征</button>    </div></div><div id="feature-result" class="hidden" style="margin-top: 20px;"></div>
        </div>
        <div id="deep-panel" class="hidden"><div style="display:grid; grid-template-columns: 1fr 1fr; gap:24px;">    <div>        <h3 style="margin-bottom:12px;color:#ccc;">关键词深度分析</h3>        <div class="form-row"><div class="input-group" style="flex:2;">    <label>关键词</label>    <input type="text" id="deep-keyword" placeholder="例如: AI教程"></div><div class="input-group" style="flex:1;">    <label>视频数</label>    <select id="deep-max-results">        <option value="20">20</option>        <option value="30" selected>30</option>        <option value="50">50</option>    </select></div><div class="input-group" style="flex:1;">    <label>时间范围</label>    <select id="deep-time-range">        <option value="this_week">本周</option>        <option value="this_month" selected>本月</option>        <option value="past_year">过去一年</option>    </select></div><div class="input-group" style="flex:0 0 auto; display:flex; align-items:flex-end;">    <button class="btn-search" onclick="analyzeShortsDetailed()">🔍 分析</button></div>        </div>        <div id="deep-result" style="margin-top:16px;"></div>    </div>    <div>        <h3 style="margin-bottom:12px;color:#ccc;">频道 Shorts 分析</h3>        <div class="form-row"><div class="input-group" style="flex:2;">    <label>频道 ID</label>    <input type="text" id="channel-insights-id" placeholder="UC..."></div><div class="input-group" style="flex:1;">    <label>时间范围</label>    <select id="channel-insights-time">        <option value="this_month">本月</option>        <option value="past_year" selected>过去一年</option>    </select></div><div class="input-group" style="flex:0 0 auto; display:flex; align-items:flex-end;">    <button class="btn-search" onclick="getChannelInsights()">📊 分析</button></div>        </div>        <div id="channel-insights-result" style="margin-top:16px;"></div>    </div></div>
        </div>
        <div id="trend-panel" class="hidden"><div class="form-row">    <div class="input-group" style="flex: 2;">        <label>关键词</label>        <input type="text" id="trend-keyword" placeholder="输入关键词追踪趋势">    </div>    <div class="input-group" style="flex: 0 0 auto;">        <button class="btn-search" onclick="trackTrend()">📈 追踪</button>    </div></div><div id="trend-result" class="hidden" style="margin-top: 20px;"></div>
        </div>
        <div id="discover-panel" class="hidden"><div class="form-row"><div class="input-group" style="flex:2;"><label>种子关键词</label><input type="text" id="discover-seed" placeholder="例如: 美食"></div><div class="input-group"><label>时间范围</label><select id="discover-time-range"><option value="this_week">本周</option><option value="this_month" selected>本月</option><option value="past_year">过去一年</option></select></div><div class="input-group"><label>候选数</label><select id="discover-limit"><option value="5" selected>5</option><option value="8">8</option><option value="10">10</option></select></div><div class="input-group" style="flex:0 0 auto; display:flex; align-items:flex-end;"><button class="btn-search" onclick="discoverKeywords()">🧭 挖掘</button></div></div><div style="font-size:12px;color:#888;margin-top:-4px;">先挖种子视频的标签/话题再排序。<label style="display:inline;text-transform:none;color:#888;"><input type="checkbox" id="discover-scan" checked style="width:auto;margin:0 4px 0 8px;">扫描验证候选（每个 +100 配额）</label></div><div id="discover-result" class="hidden" style="margin-top:16px;"></div></div>
        </div>
        <div id="loading" class="loading hidden">正在分析<span></span></div>
        <div id="results" class="hidden"><div class="toolbar">    <button class="btn-tool" onclick="copyResults()">📋 复制结果</button>    <button class="btn-tool" onclick="exportJSON()">💾 导出 JSON</button>    <button class="btn-tool" onclick="exportCSV()">📊 导出 CSV</button>    <button class="btn-tool" onclick="compareSearches()">⚖️ 对比分析</button>    <button class="btn-tool" onclick="loadQuota()">📉 API 配额</button></div><div id="quota-box" class="hidden" style="margin-bottom:16px;"><div id="quota-text" style="font-size:13px;color:#888;"></div><div class="quota-bar"><div id="quota-fill" class="quota-fill" style="width:0%"></div></div></div><div class="stats-grid">    <div class="stat-card"><div class="stat-value" id="stat-videos">-</div><div class="stat-label">视频总数</div></div>    <div class="stat-card"><div class="stat-value" id="stat-views">-</div><div class="stat-label">平均播放量</div></div>    <div class="stat-card"><div class="stat-value" id="stat-velocity">-</div><div class="stat-label">平均播放/天</div></div>    <div class="stat-card"><div class="stat-value" id="stat-likes">-</div><div class="stat-label">平均点赞数</div></div>    <div class="stat-card"><div class="stat-value" id="stat-comments">-</div><div class="stat-label">平均评论数</div></div>    <div class="stat-card"><div class="stat-value" id="stat-freq">-</div><div class="stat-label">月均发布</div></div></div><div class="chart-section">    <div class="chart-card"><h3>📈 播放量趋势</h3><div class="chart-container"><canvas id="views-chart"></canvas></div></div>    <div class="chart-card"><h3>🏷️ 热门标签</h3><div class="tag-cloud" id="tags-cloud"></div></div></div><div class="chart-section">    <div class="chart-card"><h3>💬 互动率分布</h3><div class="chart-container"><canvas id="engagement-chart"></canvas></div></div>    <div class="chart-card"><h3>📊 数据对比</h3><div class="chart-container"><canvas id="compare-chart"></canvas></div></div></div><h2 style="margin: 24px 0 16px; font-size: 18px;">🎬 热门视频</h2><div class="video-grid" id="video-grid"></div>
        </div>
        <div id="empty" class="empty"><div class="empty-icon">📺</div><p>输入关键词或频道 ID 开始分析</p>
        </div>
        <div id="comparison-result" class="comparison-result hidden"><h3 style="margin-bottom: 16px;">📊 对比结果</h3><div id="comparison-content"></div>
        </div>
    </div>
    <script>
        let viewsChart = null, engagementChart = null, compareChart = null, currentData = null;
        function toggleTheme() {document.body.classList.toggle('light');const isLight = document.body.classList.contains('light');localStorage.setItem('theme', isLight ? 'light' : 'dark');document.querySelector('.theme-toggle').textContent = isLight ? '☀️ 主题' : '🌙 主题';
        }
        (function() {const t = localStorage.getItem('theme');if (t === 'light') { document.body.classList.add('light'); document.querySelector('.theme-toggle').textContent = '☀️ 主题'; }
        })();
        function escapeHtml(s) {return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
        async function loadHistory() {const section = document.getElementById('history-section'), tags = document.getElementById('history-tags');try {    const resp = await fetch('/api/history?limit=10');    if (!resp.ok) throw new Error('history unavailable');    const history = await resp.json();    if (!history.length) { section.style.display = 'none'; return; }    section.style.display = 'block';    tags.innerHTML = history.map(h => `<span class="history-tag" data-q="${escapeHtml(h.query)}">${escapeHtml(h.query)}</span>`).join('');tags.querySelectorAll('.history-tag').forEach(el => el.addEventListener('click', () => useHistory(el.dataset.q)));} catch (e) { section.style.display = 'none'; }
        }
        function useHistory(q) { document.getElementById('keywords').value = q; searchTrends(); }
        async function clearHistory() {try { await fetch('/api/history', { method: 'DELETE' }); } catch (e) {} loadHistory(); }
        async function loadQuota() {const box = document.getElementById('quota-box'), text = document.getElementById('quota-text'), fill = document.getElementById('quota-fill');box.classList.remove('hidden');try {    const resp = await fetch('/api/quota');    if (!resp.ok) throw new Error((await resp.json()).detail || '配额查询失败');    const q = await resp.json();    const cls = q.usage_percent >= 90 ? 'quota-fill danger' : q.usage_percent >= 80 ? 'quota-fill warning' : 'quota-fill';    text.textContent = `今日已用 ${q.used.toLocaleString()} / ${q.limit.toLocaleString()} 单位（${q.usage_percent}%），剩余 ${q.remaining.toLocaleString()}${q.warning ? ' ⚠️ 接近上限' : ''}`;    fill.className = cls; fill.style.width = Math.min(q.usage_percent, 100) + '%';} catch (e) { text.textContent = '配额查询失败: ' + e.message; fill.style.width = '0%'; }
        }
        async function compareSearches() {const kw = document.getElementById('keywords').value.trim();const kw2 = prompt('与哪个关键词对比？', '');if (!kw || !kw2 || !kw2.trim()) return;const box = document.getElementById('comparison-result'), content = document.getElementById('comparison-content');box.classList.remove('hidden');content.innerHTML = '<div class="loading">对比中...</div>';try {    const resp = await fetch('/api/compare', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query1: kw, query2: kw2.trim() }) });    if (!resp.ok) throw new Error((await resp.json()).detail || '对比失败');    renderComparison(await resp.json());} catch (e) { content.innerHTML = `<div class="alert alert-error">对比失败: ${escapeHtml(e.message)}</div>`; }
        }
        function renderComparison(d) {const c = d.comparison, s1 = d.stats1, s2 = d.stats2;const win = c.winner === 'query1' ? d.query1 : d.query2;const rows = [['视频数', s1.total_count, s2.total_count], ['平均播放量', s1.avg_views, s2.avg_views], ['总播放量', c.query1_total_views, c.query2_total_views], ['总点赞', c.query1_total_likes, c.query2_total_likes], ['月均发布', c.query1_upload_freq, c.query2_upload_freq]];document.getElementById('comparison-content').innerHTML = `<p style="margin-bottom:16px;">🏆 播放量胜出: <strong>${escapeHtml(win)}</strong></p><table class="batch-table"><thead><tr><th>指标</th><th>${escapeHtml(d.query1)}</th><th>${escapeHtml(d.query2)}</th></tr></thead><tbody>${rows.map(r => `<tr><td>${r[0]}</td><td>${formatNumber(r[1])}</td><td>${formatNumber(r[2])}</td></tr>`).join('')}</tbody></table>`;}
        loadHistory();
        


        function switchTab(el, tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));el.classList.add('active');document.getElementById('keywords-panel').classList.toggle('hidden', tab !== 'keywords');document.getElementById('channel-panel').classList.toggle('hidden', tab !== 'channel');document.getElementById('batch-panel').classList.toggle('hidden', tab !== 'batch');document.getElementById('hot-panel').classList.toggle('hidden', tab !== 'hot');document.getElementById('feature-panel').classList.toggle('hidden', tab !== 'feature');document.getElementById('deep-panel').classList.toggle('hidden', tab !== 'deep');document.getElementById('trend-panel').classList.toggle('hidden', tab !== 'trend');document.getElementById('discover-panel').classList.toggle('hidden', tab !== 'discover');
}
        function formatNumber(num) {if (!num) return '0';if (num >= 100000000) return (num / 100000000).toFixed(1) + '亿';if (num >= 10000) return (num / 10000).toFixed(1) + '万';return num.toLocaleString();
        }
        function formatDate(d) {if (!d) return '';const diff = (Date.now() - new Date(d).getTime()) / 1000;if (diff < 60) return '刚刚'; if (diff < 3600) return Math.floor(diff/60)+'分钟前';if (diff < 86400) return Math.floor(diff/3600)+'小时前';if (diff < 2592000) return Math.floor(diff/86400)+'天前';return new Date(d).toLocaleDateString('zh-CN');
        }
        async function fetchTrends(endpoint, params) {const loading = document.getElementById('loading'), results = document.getElementById('results'), empty = document.getElementById('empty');loading.classList.remove('hidden'); results.classList.add('hidden'); empty.classList.add('hidden');try {    const resp = await fetch(`${endpoint}?${new URLSearchParams(params)}`);    if (!resp.ok) { const e = await resp.json(); throw new Error(e.detail || '请求失败'); }    currentData = await resp.json(); renderResults(currentData);    const url = new URL(window.location.href); url.searchParams.set('keywords', params.keywords?.join(',') || '');    window.history.replaceState({}, '', url);} catch (e) { alert('获取数据失败: ' + e.message); empty.classList.remove('hidden'); }finally { loading.classList.add('hidden'); }
        }
        async function searchTrends() {const kw = document.getElementById('keywords').value.trim();if (!kw) { alert('请输入关键词'); return; }await fetchTrends('/api/trends/search', { keywords: kw.split(',').map(k=>k.trim()), max_results: document.getElementById('max-results').value, order: document.getElementById('sort-order').value, time_range: document.getElementById('time-range').value });
        }
        async function searchChannel() {const ch = document.getElementById('channel-input').value.trim();if (!ch) { alert('请输入频道 ID'); return; }const m = ch.match(/(UC[a-zA-Z0-9_-]+)/);if (!m && !ch.startsWith('UC')) { alert('无效的频道 ID 格式'); return; }await fetchTrends('/api/trends/channel', { channel_id: m ? m[1] : ch, max_results: 20, order: document.getElementById('channel-sort').value, time_range: document.getElementById('channel-time-range').value });
        }
        async function searchChannels() {const q = document.getElementById('channel-search-input').value.trim();if (!q) { alert('请输入频道名称'); return; }const box = document.getElementById('channel-search-results');box.classList.remove('hidden');box.innerHTML = '<div class="loading">搜索中</div>';try {    const resp = await fetch(`/api/trends/channels/search?q=${encodeURIComponent(q)}&max_results=10`);    if (!resp.ok) throw new Error((await resp.json()).detail || '搜索失败');    const data = await resp.json();    if (!data.channels.length) { box.innerHTML = '<div class="alert alert-warning">没有找到频道</div>'; return; }    box.innerHTML = data.channels.map(c => `<div class="history-item" style="cursor:pointer;" onclick="useChannel('${escapeHtml(c.channel_id)}')"><div style="min-width:0;"><strong>${escapeHtml(c.title)}</strong><div style="font-size:12px;color:#888;">${formatNumber(c.subscriber_count)} 订阅 · ${formatNumber(c.video_count)} 视频</div></div><span class="mini-tag">分析 →</span></div>`).join('');} catch (e) { box.innerHTML = `<div class="alert alert-error">搜索失败: ${escapeHtml(e.message)}</div>`; }
        }
        function useChannel(id) { document.getElementById('channel-input').value = id; document.getElementById('channel-search-input').value = ''; document.getElementById('channel-search-results').classList.add('hidden'); searchChannel(); }
        function renderResults(data) {document.getElementById('results').classList.remove('hidden');document.getElementById('stat-videos').textContent = data.total_count;document.getElementById('stat-views').textContent = formatNumber(Math.round(data.avg_views));document.getElementById('stat-velocity').textContent = formatNumber(Math.round(data.avg_views_per_day || 0));const tl = data.videos.reduce((s,v)=>s+v.like_count,0), tc = data.videos.reduce((s,v)=>s+v.comment_count,0);document.getElementById('stat-likes').textContent = formatNumber(Math.round(tl/data.videos.length));document.getElementById('stat-comments').textContent = formatNumber(Math.round(tc/data.videos.length));document.getElementById('stat-freq').textContent = data.upload_frequency.toFixed(1);const mx = data.top_keywords.length || 1;document.getElementById('tags-cloud').innerHTML = data.top_keywords.slice(0,20).map((t,i) => `<span class="tag" style="font-size:${12+(1-i/mx)*8}px">${escapeHtml(t)}</span>`).join('');document.getElementById('video-grid').innerHTML = data.videos.map(v => `<a href="${escapeHtml(v.url)}" target="_blank" rel="noopener" class="video-card"><div class="video-thumb"><img src="${escapeHtml(v.thumbnail)}" alt="${escapeHtml(v.title)}" loading="lazy"></div><div class="video-info"><div class="video-title">${escapeHtml(v.title)}</div><div class="video-channel">${escapeHtml(v.channel_title)}</div><div class="video-stats"><span>▶${formatNumber(v.view_count)}</span><span>⚡${formatNumber(Math.round(v.views_per_day || 0))}/天</span><span>👍${formatNumber(v.like_count)}</span><span>💬${formatNumber(v.comment_count)}</span></div></div></a>`).join('');renderCharts(data);
        }
        function renderCharts(data) {if (viewsChart) viewsChart.destroy(); if (engagementChart) engagementChart.destroy(); if (compareChart) compareChart.destroy();const lc = document.body.classList.contains('light'), tc = lc?'#666':'#888', gc = lc?'#e0e0e0':'#333';const top = data.videos.slice(0,10);viewsChart = new Chart(document.getElementById('views-chart').getContext('2d'), {    type:'bar', data:{ labels:top.map(v=>v.title.substring(0,15)+(v.title.length>15?'...':'')), datasets:[{label:'播放量',data:top.map(v=>v.view_count),backgroundColor:'rgba(255,0,0,0.6)',borderColor:'rgba(255,0,0,1)',borderWidth:1}] },    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,ticks:{color:tc},grid:{color:gc}},x:{ticks:{color:tc,maxRotation:45},grid:{display:false}}}}});engagementChart = new Chart(document.getElementById('engagement-chart').getContext('2d'), {    type:'doughnut', data:{ labels:['点赞数','评论数','收藏数(估算)'], datasets:[{data:[data.videos.reduce((s,v)=>s+v.like_count,0),data.videos.reduce((s,v)=>s+v.comment_count,0),Math.round(data.videos.reduce((s,v)=>s+v.like_count,0)*0.3)],backgroundColor:['#ff0000','#ff6b6b','#c0392b']}] },    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{color:'#fff'}}}}});compareChart = new Chart(document.getElementById('compare-chart').getContext('2d'), {    type:'radar', data:{ labels:['平均播放量','平均点赞','平均评论','互动率','发布频率'], datasets:[{label:'当前分析',data:[Math.min(data.avg_views/10000,100),Math.min(data.videos.reduce((s,v)=>s+v.like_count,0)/data.videos.length/1000,100),Math.min(data.videos.reduce((s,v)=>s+v.comment_count,0)/data.videos.length/100,100),Math.min((data.videos.reduce((s,v)=>s+v.like_count+v.comment_count,0)/Math.max(data.videos.reduce((s,v)=>s+v.view_count,1),1))*1000,100),Math.min(data.upload_frequency*10,100)],backgroundColor:'rgba(255,0,0,0.2)',borderColor:'#ff0000',borderWidth:2,pointBackgroundColor:'#ff0000'}]},    options:{ responsive:true, maintainAspectRatio:false, scales:{r:{angleLines:{color:gc},grid:{color:gc},pointLabels:{color:tc},ticks:{display:false}}}, plugins:{legend:{position:'bottom',labels:{color:'#fff'}}}}});
        }
        function copyResults() { if (!currentData) return; navigator.clipboard.writeText(JSON.stringify(currentData,null,2)).then(()=>alert('已复制到剪贴板')); }
        function exportJSON() {if (!currentData) return;const b = new Blob([JSON.stringify(currentData,null,2)],{type:'application/json'}), u = URL.createObjectURL(b);const a = document.createElement('a'); a.href=u; a.download=`yt-analysis-${Date.now()}.json`; a.click(); URL.revokeObjectURL(u);
        }
        function exportCSV() {if (!currentData?.videos?.length) return;const h=['标题','频道','播放量','点赞','评论','发布日期','链接'];const r=currentData.videos.map(v=>[v.title,v.channel_title,v.view_count,v.like_count,v.comment_count,v.published_at,v.url]);const c=['\ufeff'+h.join(','),...r.map(row=>row.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(','))].join('\n');const b=new Blob([c],{type:'text/csv;charset=utf-8;'}),u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`yt-analysis-${Date.now()}.csv`;a.click();URL.revokeObjectURL(u);
        }
        document.getElementById('keywords').addEventListener('keypress',e=>{if(e.key==='Enter')searchTrends();});
        document.getElementById('channel-input').addEventListener('keypress',e=>{if(e.key==='Enter')searchChannel();});
document.getElementById('channel-search-input').addEventListener('keypress',e=>{if(e.key==='Enter')searchChannels();});
        window.addEventListener('load',()=>{const p=new URLSearchParams(window.location.search);if(p.get('keywords')){document.getElementById('keywords').value=p.get('keywords');searchTrends();}});
    
        // Batch scan
        async function batchScan() {const kw = document.getElementById('batch-keywords').value.trim();if (!kw) { alert('请输入关键词'); return; }const loading = document.getElementById('loading'), results = document.getElementById('batch-scan-results');loading.classList.remove('hidden'); results.classList.add('hidden');try {    const resp = await fetch(`/api/trends/batch-scan?keywords=${encodeURIComponent(kw)}&time_range=${document.getElementById('batch-time-range').value}&max_results=${document.getElementById('batch-max-results').value}`);    if (!resp.ok) { const e = await resp.json(); throw new Error(e.detail || '请求失败'); }    const data = await resp.json();    renderBatchResults(data);    results.classList.remove('hidden');} catch (e) { alert('扫描失败: ' + e.message); }finally { loading.classList.add('hidden'); }
        }
        function renderBatchResults(data) {const table = document.getElementById('batch-table');const lc = document.body.classList.contains('light');const tc = lc ? '#666' : '#888', gc = lc ? '#e0e0e0' : '#333';let html = '<table class="batch-table"><thead><tr><th>关键词</th><th>视频数</th><th>平均播放</th><th>播放/天</th><th>总播放</th><th>互动率</th></tr></thead><tbody>';data.keywords.forEach(r => {    html += `<tr><td><strong>${escapeHtml(r.keyword)}</strong></td><td>${r.video_count}</td><td>${formatNumber(Math.round(r.avg_views))}</td><td>${formatNumber(Math.round(r.avg_views_per_day || 0))}</td><td>${formatNumber(r.total_views)}</td><td>${r.engagement_rate.toFixed(2)}%</td></tr>`;});html += '</tbody></table>';table.innerHTML = html;
        }

        // Hot categories
        async function loadHotCategories() {const loading = document.getElementById('loading'), results = document.getElementById('hot-results');loading.classList.remove('hidden'); results.classList.add('hidden');try {    const resp = await fetch(`/api/trends/hot-categories?time_range=${document.getElementById('hot-time-range').value}&max_results=${document.getElementById('hot-max-count').value}`);    if (!resp.ok) { const e = await resp.json(); throw new Error(e.detail || '请求失败'); }    const data = await resp.json();    renderHotResults(data);    results.classList.remove('hidden');} catch (e) { alert('扫描失败: ' + e.message); }finally { loading.classList.add('hidden'); }
        }
        function renderHotResults(data) {const chart = document.getElementById('hot-chart');if (window.hotChart) window.hotChart.destroy();const lc = document.body.classList.contains('light'), tc = lc?'#666':'#888', gc = lc?'#e0e0e0':'#333';window.hotChart = new Chart(chart.getContext('2d'), {    type:'bar',    data:{ labels: data.map(k=>k.category), datasets:[{ label:'平均播放量', data: data.map(k=>k.avg_views), backgroundColor: 'rgba(255,0,0,0.7)', borderColor: '#ff0000', borderWidth: 1 }] },    options: { responsive:true, maintainAspectRatio:false, indexAxis:'y', plugins:{ legend:{ display:false } }, scales:{ x:{ beginAtZero:true, ticks:{ color:tc, callback:v=>formatNumber(v) }, grid:{ color:gc } }, y:{ ticks:{ color:tc }, grid:{ display:false } } } }});const tableHtml = '<table class="batch-table"><thead><tr><th>#</th><th>类别</th><th>平均播放量</th><th>视频数</th><th>最高单视频</th><th>互动率</th></tr></thead><tbody>' +    data.map((k,i) => `<tr>        <td><span class="rank-badge">${i+1}</span></td>        <td><strong>${escapeHtml(k.category)}</strong>${(k.top_keywords || []).length ? '<div class="tag-list" style="margin-top:4px;">' + k.top_keywords.map(t => `<span class="mini-tag">${escapeHtml(t)}</span>`).join('') + '</div>' : ''}</td>        <td>${formatNumber(Math.round(k.avg_views))}</td>        <td>${k.video_count}</td>        <td>${formatNumber(k.top_video_views)}</td>        <td>${k.engagement_rate.toFixed(2)}%</td>    </tr>`).join('') + '</tbody></table>';document.getElementById('hot-table').innerHTML = tableHtml;
        }

        // Feature analysis
        async function analyzeFeatures() {const kw = document.getElementById('feature-keyword').value.trim();if (!kw) { alert('请输入关键词'); return; }const loading = document.getElementById('loading'), results = document.getElementById('feature-result');loading.classList.remove('hidden'); results.classList.add('hidden');try {    const resp = await fetch(`/api/trends/feature-analysis?keyword=${encodeURIComponent(kw)}&time_range=${document.getElementById('feature-time-range').value}&max_results=${document.getElementById('feature-max-results').value}`);    if (!resp.ok) { const e = await resp.json(); throw new Error(e.detail || '请求失败'); }    const data = await resp.json();    renderFeatureResults(data);    results.classList.remove('hidden');} catch (e) { alert('分析失败: ' + e.message); }finally { loading.classList.add('hidden'); }
        }
        function renderFeatureResults(data) {const lc = document.body.classList.contains('light');const tc = lc ? '#666' : '#888', gc = lc ? '#e0e0e0' : '#333';let html = '<div class="detail-grid">';html += `<div class="detail-card"><div class="detail-val">${data.total_videos}</div><div class="detail-lbl">总视频数</div></div>`;html += `<div class="detail-card"><div class="detail-val">${formatNumber(Math.round(data.avg_views))}</div><div class="detail-lbl">平均播放</div></div>`;html += `<div class="detail-card"><div class="detail-val">${data.success_score?.toFixed(1) ?? '-'}</div><div class="detail-lbl">成功评分</div></div>`;html += `<div class="detail-card"><div class="detail-val">${data.avg_duration_sec?.toFixed(1) ?? '-'}</div><div class="detail-lbl">平均时长(秒)</div></div>`;html += '</div>';if (data.optimal_posting_hours?.length) {    html += '<div class="chart-card" style="margin-top:12px;"><h3>最佳发布时间</h3><div class="tag-list" style="margin-top:8px;">';    data.optimal_posting_hours.forEach(h => {        html += `<span class="mini-tag">${escapeHtml(h)}</span>`;    });    html += '</div></div>';}if (data.duration_range) {    html += `<div style="margin-top:20px;"><h3>时长区间</h3><div class="tag-list" style="margin-top:12px;"><span class="mini-tag">${escapeHtml(data.duration_range)}</span></div></div>`;}if (data.title_patterns?.length) {    html += '<div style="margin-top:20px;"><h3>标题特征</h3><div class="tag-list" style="margin-top:12px;">';    data.title_patterns.forEach(p => {        html += `<span class="mini-tag">${escapeHtml(p)}</span>`;    });    html += '</div></div>';}document.getElementById('feature-result').innerHTML = html;
        }

        // Detailed shorts analysis
        async function analyzeShortsDetailed() {const kw = document.getElementById('deep-keyword').value.trim();if (!kw) { alert('请输入关键词'); return; }const results = document.getElementById('deep-result');results.innerHTML = '<div class="loading">分析中...</div>';results.classList.remove('hidden');try {    const resp = await fetch(`/api/shorts/detailed?keyword=${encodeURIComponent(kw)}&max_results=${document.getElementById('deep-max-results').value}&time_range=${document.getElementById('deep-time-range').value}`);    if (!resp.ok) { const e = await resp.json(); throw new Error(e.detail || '请求失败'); }    const data = await resp.json();    renderDetailedResults(data);} catch (e) { results.innerHTML = `<div class="alert alert-error">失败: ${e.message}</div>`; }
        }
        function renderDetailedResults(data) {const lc = document.body.classList.contains('light');const tc = lc ? '#666' : '#888', gc = lc ? '#e0e0e0' : '#333';let html = '<div class="detail-grid">';html += `<div class="detail-card"><div class="detail-val">${data.total_videos}</div><div class="detail-lbl">总视频数</div></div>`;html += `<div class="detail-card"><div class="detail-val">${formatNumber(Math.round(data.avg_views))}</div><div class="detail-lbl">平均播放</div></div>`;html += `<div class="detail-card"><div class="detail-val">${data.overall_engagement_rate?.toFixed(2) ?? '-'}%</div><div class="detail-lbl">平均互动率</div></div>`;html += `<div class="detail-card"><div class="detail-val">${data.p25_views > 0 ? formatNumber(data.p25_views) : '- '}</div><div class="detail-lbl">P25 播放量</div></div>`;html += `<div class="detail-card"><div class="detail-val">${formatNumber(data.median_views)}</div><div class="detail-lbl">中位播放量</div></div>`;html += `<div class="detail-card"><div class="detail-val">${formatNumber(data.p75_views)}</div><div class="detail-lbl">P75 播放量</div></div>`;html += `<div class="detail-card"><div class="detail-val">${formatNumber(data.total_views)}</div><div class="detail-lbl">总播放量</div></div>`;html += '</div>';if (data.hourly_stats?.length) {    html += '<div class="chart-card"><h3>分时段互动率</h3><div class="chart-container" style="height:250px;"><canvas id="hourly-chart"></canvas></div></div>';    setTimeout(() => {        const ctx = document.getElementById('hourly-chart').getContext('2d');        if (window.hourlyChart) window.hourlyChart.destroy();        window.hourlyChart = new Chart(ctx, {type: 'line',data: { labels: data.hourly_stats.map(h=>h.hour), datasets: [{ label:'互动率', data: data.hourly_stats.map(h=>h.engagement_rate.toFixed(2)), borderColor: '#ff0000', backgroundColor: 'rgba(255,0,0,0.1)', tension: 0.4, fill: true }] },options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:tc}}}, scales:{y:{beginAtZero:true,ticks:{color:tc,callback:v=>v+'%'},grid:{color:gc}},x:{ticks:{color:tc},grid:{display:false}}}}        });    }, 100);}if (data.duration_buckets?.length) {    html += '<div class="chart-card" style="margin-top:20px;"><h3>时长分布</h3><div class="chart-container" style="height:250px;"><canvas id="detail-duration-chart"></canvas></div></div>';    setTimeout(() => {        const ctx = document.getElementById('detail-duration-chart').getContext('2d');        if (window.detailDurationChart) window.detailDurationChart.destroy();        window.detailDurationChart = new Chart(ctx, {type: 'bar',data: { labels: data.duration_buckets.map(d=>d.label), datasets: [{ label:'视频数', data: data.duration_buckets.map(d=>d.count), backgroundColor: 'rgba(255,0,0,0.7)', borderColor: '#ff0000', borderWidth: 1 }] },options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,ticks:{color:tc},grid:{color:gc}},x:{ticks:{color:tc},grid:{display:false}}}}        });    }, 100);}if (data.views_quantiles?.length) {    html += '<div style="margin-top:20px;"><h3>播放量分位</h3><div style="margin-top:12px;">';    data.views_quantiles.forEach(q => {        html += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid ${lc?'#e0e0e0':'#333'};"><span>${q.percentile}%</span><span style="color:#ff0000;font-weight:bold;">${formatNumber(q.min_views)}</span></div>`;    });    html += '</div></div>';}if (data.top_channels?.length) {    html += '<div style="margin-top:20px;"><h3>高播放频道</h3><table class="batch-table"><thead><tr><th>频道</th><th>视频数</th><th>总播放</th><th>平均播放</th></tr></thead><tbody>';    data.top_channels.forEach(c => {        html += `<tr><td><strong>${escapeHtml(c.channel)}</strong></td><td>${c.video_count}</td><td>${formatNumber(c.total_views)}</td><td>${formatNumber(Math.round(c.avg_views))}</td></tr>`;    });    html += '</tbody></table></div>';}if (data.top_tags_by_views?.length || data.top_keywords?.length) {    html += '<div style="margin-top:20px;"><h3>高播放标签</h3><div class="tag-list" style="margin-top:8px;">';    (data.top_tags_by_views || []).forEach(t => {        html += `<span class="mini-tag">${escapeHtml(t.tag)} · ${formatNumber(Math.round(t.avg_views))}</span>`;    });    (data.top_keywords || []).forEach(k => {        html += `<span class="mini-tag">${escapeHtml(k)}</span>`;    });    html += '</div></div>';}document.getElementById('deep-result').innerHTML = html;
        }

        // Channel insights
        async function getChannelInsights() {const cid = document.getElementById('channel-insights-id').value.trim();if (!cid) { alert('请输入频道 ID'); return; }const results = document.getElementById('channel-insights-result');results.innerHTML = '<div class="loading">分析中...</div>';results.classList.remove('hidden');try {    const resp = await fetch(`/api/shorts/channel-insights?channel_id=${encodeURIComponent(cid)}&time_range=${document.getElementById('channel-insights-time').value}`);    if (!resp.ok) { const e = await resp.json(); throw new Error(e.detail || '请求失败'); }    const data = await resp.json();    renderChannelInsights(data);} catch (e) { results.innerHTML = `<div class="alert alert-error">失败: ${e.message}</div>`; }
        }
        function renderChannelInsights(data) {const lc = document.body.classList.contains('light');const tc = lc ? '#666' : '#888', gc = lc ? '#e0e0e0' : '#333';let html = '<div class="detail-grid">';html += `<div class="detail-card"><div class="detail-val">${data.total_shorts}</div><div class="detail-lbl">Shorts 总数</div></div>`;html += `<div class="detail-card"><div class="detail-val">${formatNumber(Math.round(data.avg_views))}</div><div class="detail-lbl">平均播放</div></div>`;html += `<div class="detail-card"><div class="detail-val">${data.avg_engagement_rate?.toFixed(2) ?? '-'}%</div><div class="detail-lbl">平均互动率</div></div>`;html += `<div class="detail-card"><div class="detail-val">${data.upload_frequency_per_month?.toFixed(1) ?? '-'}</div><div class="detail-lbl">月均发布</div></div>`;html += '</div>';if (data.top_tags?.length) {    html += '<div class="chart-card" style="margin-top:12px;"><h3>热门标签</h3><div class="tag-list" style="margin-top:8px;">';    data.top_tags.forEach(t => {        html += `<span class="mini-tag">${escapeHtml(t)}</span>`;    });    html += '</div></div>';}if (data.duration_histogram?.length) {    html += '<div class="chart-card" style="margin-top:12px;"><h3>时长分布</h3><div class="tag-list" style="margin-top:8px;">';    data.duration_histogram.forEach(d => {        html += `<span class="mini-tag">${d.label}: ${d.count}</span>`;    });    html += '</div></div>';}if (data.views_over_time?.length) {    html += '<div class="chart-card" style="margin-top:12px;"><h3>播放量走势</h3><div class="chart-container" style="height:220px;"><canvas id="ci-views-chart"></canvas></div></div>';    setTimeout(() => {        const canvas = document.getElementById('ci-views-chart');        if (!canvas) return;        if (window.ciViewsChart) window.ciViewsChart.destroy();        window.ciViewsChart = new Chart(canvas.getContext('2d'), {type:'line',data:{labels:data.views_over_time.map(p=>p.date),datasets:[{label:'播放量',data:data.views_over_time.map(p=>p.views),borderColor:'#ff0000',backgroundColor:'rgba(255,0,0,0.1)',tension:0.4,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:tc}}},scales:{y:{beginAtZero:true,ticks:{color:tc,callback:v=>formatNumber(v)},grid:{color:gc}},x:{ticks:{color:tc},grid:{display:false}}}}});    }, 100);}if (data.top_videos?.length) {    html += '<div style="margin-top:20px;"><h3>高播放 Shorts</h3><div style="margin-top:12px;">';    data.top_videos.forEach(v => {        html += `<div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid ${lc?'#e0e0e0':'#333'};font-size:13px;"><a href="https://www.youtube.com/watch?v=${escapeHtml(v.video_id)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(v.title)}</a><span style="color:#00ff88;white-space:nowrap;">${formatNumber(v.view_count)} · ${formatNumber(Math.round(v.views_per_day || 0))}/天</span></div>`;    });    html += '</div></div>';}document.getElementById('channel-insights-result').innerHTML = html;
        }

        // Trend tracking
        async function trackTrend(force) {const kw = document.getElementById('trend-keyword').value.trim();if (!kw) { alert('请输入关键词'); return; }const loading = document.getElementById('loading'), results = document.getElementById('trend-result');loading.classList.remove('hidden'); results.classList.add('hidden');try {    const resp = await fetch(`/api/trends/trend-tracking?keyword=${encodeURIComponent(kw)}${force ? '&refresh=true' : ''}`);    if (!resp.ok) { const e = await resp.json(); throw new Error(e.detail || '请求失败'); }    const data = await resp.json();    renderTrendResults(data);    results.classList.remove('hidden');} catch (e) { alert('追踪失败: ' + e.message); }finally { loading.classList.add('hidden'); }
        }
        function renderTrendResults(data) {const lc = document.body.classList.contains('light');const tc = lc ? '#666' : '#888', gc = lc ? '#e0e0e0' : '#333';const snaps = [...(data.snapshots || [])].reverse();const metric = snaps.some(s => s.views_per_day > 0) ? 'views_per_day' : 'avg_views';const metricLabel = metric === 'views_per_day' ? '播放速度/天' : '平均播放量';const metricValue = s => Math.round(metric === 'views_per_day' ? s.views_per_day : s.avg_views);let html = `<div class="chart-card"><h3>趋势变化<button class="btn-tool" style="float:right;" onclick="trackTrend(true)">🔄 强制刷新</button></h3><div class="chart-container" style="height:300px;"><canvas id="trend-chart"></canvas></div></div>`;if (snaps.length) {    html += '<div style="margin-top:20px;"><h3>历史记录</h3><div style="margin-top:12px;">';    html += snaps.slice().reverse().map(s => `<div style="padding: 8px 0; border-bottom: 1px solid #333; font-size: 13px;"><span style="color: #888;">${new Date(s.recorded_at).toLocaleString()}</span><span style="float: right; color: #00ff88;">${formatNumber(metricValue(s))} ${metric === 'views_per_day' ? '/天' : '播放'}</span><span style="float: right; margin-right: 12px; color: #888;">${s.total_videos} 视频</span></div>`).join('');    html += '</div></div>';} else {    html += '<div style="color:#666;padding:12px;">暂无历史记录，点击"强制刷新"获取首次数据</div>';}document.getElementById('trend-result').innerHTML = html;setTimeout(() => {    const canvas = document.getElementById('trend-chart');    if (!canvas) return;    const ctx = canvas.getContext('2d');    if (window.trendChart) window.trendChart.destroy();    window.trendChart = new Chart(ctx, {        type: 'line',        data: { labels: snaps.map(s => new Date(s.recorded_at).toLocaleString('zh-CN')), datasets: [{ label:metricLabel, data: snaps.map(metricValue), borderColor: '#ff0000', backgroundColor: 'rgba(255,0,0,0.1)', tension: 0.4, fill: true }, { label:'视频数', data: snaps.map(s => s.total_videos), borderColor: '#00ff88', backgroundColor: 'rgba(0,255,136,0.1)', tension: 0.4, fill: false, yAxisID: 'y1' }] },        options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:tc}}}, scales:{y:{beginAtZero:true,ticks:{color:tc,callback:v=>formatNumber(v)},grid:{color:gc}},y1:{position:'right',beginAtZero:true,ticks:{color:'#00ff88'},grid:{display:false}},x:{ticks:{color:tc},grid:{color:gc}}}}    });}, 100);
        }
        async function discoverKeywords() {const seed = document.getElementById('discover-seed').value.trim();if (!seed) { alert('请输入种子关键词'); return; }const scan = document.getElementById('discover-scan').checked;const box = document.getElementById('discover-result');box.classList.remove('hidden');box.innerHTML = `<div class="loading">挖掘中${scan ? '（正在扫描候选词）' : ''}</div>`;try {    const params = new URLSearchParams({ seed: seed, limit: document.getElementById('discover-limit').value, scan: String(scan), time_range: document.getElementById('discover-time-range').value });    const resp = await fetch(`/api/discover?${params}`);    if (!resp.ok) throw new Error((await resp.json()).detail || '挖掘失败');    renderDiscovery(await resp.json());} catch (e) { box.innerHTML = `<div class="alert alert-error">挖掘失败: ${escapeHtml(e.message)}</div>`; }
        }
        function renderDiscovery(data) {const box = document.getElementById('discover-result');if (!data.candidates?.length) { box.innerHTML = '<div class="alert alert-warning">没有挖到相关关键词</div>'; return; }const scan = data.candidates.some(c => c.scanned);let html = `<p style="margin-bottom:12px;color:#888;font-size:13px;">种子「${escapeHtml(data.seed)}」的候选词（按${scan ? '播放速度' : '共现次数'}排序）</p>`;html += `<table class="batch-table"><thead><tr><th>候选词</th><th>出现次数</th>${scan ? '<th>平均播放</th><th>播放/天</th><th>竞争(视频数)</th><th>互动率</th>' : ''}<th></th></tr></thead><tbody>`;data.candidates.forEach(c => {    html += `<tr><td><strong>${escapeHtml(c.keyword)}</strong></td><td>${c.occurrences}</td>`;    if (scan) html += `<td>${c.scanned ? formatNumber(Math.round(c.avg_views)) : '-'}</td><td>${c.scanned ? formatNumber(Math.round(c.avg_views_per_day)) : '-'}</td><td>${c.scanned ? c.video_count : '-'}</td><td>${c.scanned ? c.engagement_rate.toFixed(2) + '%' : '-'}</td>`;    html += `<td><button class="btn-tool" data-kw="${escapeHtml(c.keyword)}" onclick="useDiscovered(this.dataset.kw)">分析 →</button></td></tr>`;});html += '</tbody></table>';box.innerHTML = html;
        }
        function useDiscovered(keyword) { switchTab(document.querySelectorAll('.tab')[0], 'keywords'); document.getElementById('keywords').value = keyword; searchTrends(); }
        document.getElementById('discover-seed').addEventListener('keypress',e=>{if(e.key==='Enter')discoverKeywords();});
        document.getElementById('deep-keyword').addEventListener('keypress',e=>{if(e.key==='Enter')analyzeShortsDetailed();});
        document.getElementById('channel-insights-id').addEventListener('keypress',e=>{if(e.key==='Enter')getChannelInsights();});
        document.getElementById('trend-keyword').addEventListener('keypress',e=>{if(e.key==='Enter')trackTrend();});


    </script>
</body>
</html>
