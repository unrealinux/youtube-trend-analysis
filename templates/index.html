<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 数据分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; transition: background 0.3s, color 0.3s; }
        body.light { background: #f5f5f5; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; padding: 30px 0 20px; font-size: 28px; }
        h1 span { color: #ff0000; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; z-index: 100; background: #2a2a2a; border: none; color: #fff; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        body.light .theme-toggle { background: #e0e0e0; color: #333; }
        .search-panel { background: #1a1a1a; border-radius: 12px; padding: 24px; margin-bottom: 24px; transition: background 0.3s; }
        body.light .search-panel { background: #fff; border: 1px solid #e0e0e0; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab { padding: 10px 20px; background: #2a2a2a; border: none; color: #aaa; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .tab.active { background: #ff0000; color: #fff; }
        body.light .tab { background: #f0f0f0; color: #666; }
        body.light .tab.active { background: #ff0000; color: #fff; }
        .tab:hover:not(.active) { background: #333; }
        body.light .tab:hover:not(.active) { background: #e0e0e0; }
        .form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
        .input-group { flex: 1; min-width: 200px; }
        label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 12px 16px; background: #2a2a2a; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 14px; }
        body.light input, body.light select { background: #f5f5f5; border-color: #ddd; color: #333; }
        input:focus, select:focus { outline: none; border-color: #ff0000; }
        input::placeholder { color: #666; }
        .btn-search { padding: 12px 32px; background: #ff0000; border: none; color: #fff; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        .btn-search:hover { background: #cc0000; }
        .btn-search:disabled { background: #666; cursor: not-allowed; }
        .history-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid #333; }
        body.light .history-section { border-color: #e0e0e0; }
        .history-label { font-size: 12px; color: #666; margin-bottom: 8px; }
        .history-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .history-tag { background: #2a2a2a; color: #aaa; padding: 4px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
        body.light .history-tag { background: #f0f0f0; color: #666; }
        .history-tag:hover { background: #ff0000; color: #fff; }
        .history-clear { background: none; border: none; color: #666; font-size: 12px; cursor: pointer; margin-left: auto; }
        .history-clear:hover { color: #ff0000; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: #1a1a1a; border-radius: 12px; padding: 20px; text-align: center; transition: background 0.3s; }
        body.light .stat-card { background: #fff; border: 1px solid #e0e0e0; }
        .stat-value { font-size: 32px; font-weight: bold; color: #ff0000; }
        .stat-label { font-size: 12px; color: #888; margin-top: 8px; text-transform: uppercase; }
        .chart-section { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 24px; }
        @media (max-width: 768px) { .chart-section { grid-template-columns: 1fr; } }
        .chart-card { background: #1a1a1a; border-radius: 12px; padding: 20px; transition: background 0.3s; }
        body.light .chart-card { background: #fff; border: 1px solid #e0e0e0; }
        .chart-card h3 { margin-bottom: 16px; font-size: 16px; color: #ccc; }
        body.light .chart-card h3 { color: #333; }
        .chart-container { position: relative; height: 300px; }
        .tag-cloud { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0; }
        .tag { background: #2a2a2a; color: #ccc; padding: 6px 14px; border-radius: 20px; font-size: 13px; transition: all 0.2s; }
        body.light .tag { background: #f0f0f0; color: #666; }
        .tag:hover { background: #ff0000; color: #fff; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .video-card { background: #1a1a1a; border-radius: 12px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; text-decoration: none; color: inherit; display: block; }
        body.light .video-card { background: #fff; border: 1px solid #e0e0e0; }
        .video-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(255,0,0,0.2); }
        .video-thumb { position: relative; padding-top: 56.25%; }
        .video-thumb img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .video-info { padding: 12px; }
        .video-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .video-channel { font-size: 12px; color: #888; margin-bottom: 8px; }
        .video-stats { display: flex; gap: 16px; font-size: 12px; color: #aaa; }
        .video-stats span { display: flex; align-items: center; gap: 4px; }
        .toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .btn-tool { padding: 8px 16px; background: #2a2a2a; border: none; color: #ccc; border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        body.light .btn-tool { background: #f0f0f0; color: #666; }
        .btn-tool:hover { background: #ff0000; color: #fff; }
        .loading { text-align: center; padding: 40px; color: #888; }
        .loading::after { content: ''; animation: dots 1.5s infinite; }
        @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
        .empty { text-align: center; padding: 60px 20px; color: #666; }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .hidden { display: none; }
        /* New styles for comparison and history dashboard */
        .comparison-panel { background: #1a1a1a; border-radius: 12px; padding: 24px; margin-bottom: 24px; transition: background 0.3s; }
        body.light .comparison-panel { background: #fff; border: 1px solid #e0e0e0; }
        .history-dashboard { background: #1a1a1a; border-radius: 12px; padding: 24px; margin-bottom: 24px; transition: background 0.3s; }
        body.light .history-dashboard { background: #fff; border: 1px solid #e0e0e0; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #2a2a2a; border-radius: 8px; margin-bottom: 8px; }
        body.light .history-item { background: #f5f5f5; }
        .history-item:hover { background: #333; }
        body.light .history-item:hover { background: #e0e0e0; }
        .comparison-result { background: #1a1a1a; border-radius: 12px; padding: 24px; margin-top: 24px; transition: background 0.3s; }
        body.light .comparison-result { background: #fff; border: 1px solid #e0e0e0; }
        .quota-bar { height: 8px; background: #2a2a2a; border-radius: 4px; overflow: hidden; margin-top: 8px; }
        body.light .quota-bar { background: #e0e0e0; }
        .quota-fill { height: 100%; background: #ff0000; transition: width 0.3s; }
        .quota-fill.warning { background: #ff6b6b; }
        .quota-fill.danger { background: #dc2626; }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; }
        .alert-warning { background: #fef3c7; color: #92400e; }
        body.light .alert-warning { background: #fef3c7; }
        .alert-error { background: #fee2e2; color: #991b1b; }
        .batch-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .batch-table th, .batch-table td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        body.light .batch-table th, body.light .batch-table td { border-color: #e0e0e0; }
        .batch-table th { background: #2a2a2a; color: #ff0000; font-size: 12px; text-transform: uppercase; }
        body.light .batch-table th { background: #f5f5f5; }
        .batch-table tr:hover { background: #1a1a1a; }
        body.light .batch-table tr:hover { background: #f0f0f0; }
        .rank-badge { display: inline-block; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%; background: #ff0000; color: #fff; font-size: 12px; font-weight: bold; }
        .heat-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:2px; margin-top:8px; }
        .heat-cell { aspect-ratio:1; border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; font-weight:bold; }
        .detail-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:20px; }
        .detail-card { background:#1a1a1a; border-radius:10px; padding:14px; text-align:center; }
        body.light .detail-card { background:#fff; border:1px solid #e0e0e0; }
        .detail-val { font-size:22px; font-weight:bold; color:#ff0000; }
        .detail-lbl { font-size:11px; color:#888; margin-top:4px; text-transform:uppercase; }
        .tag-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
        .mini-tag { background:#2a2a2a; color:#aaa; padding:3px 10px; border-radius:10px; font-size:11px; }
        body.light .mini-tag { background:#f0f0f0; color:#666; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">🌙 主题</button>
    <div class="container">
        <h1>📊 YouTube <span>数据分析</span></h1>
        <div class="search-panel"><div class="tabs">
                <button class="tab active" onclick="switchTab(this, 'keywords')">关键词搜索</button>
                <button class="tab" onclick="switchTab(this, 'channel')">频道分析</button>
                <button class="tab" onclick="switchTab(this, 'batch')">批量扫描</button>
                <button class="tab" onclick="switchTab(this, 'hot')">热门类别</button>
                <button class="tab" onclick="switchTab(this, 'feature')">特征分析</button>
                <button class="tab" onclick="switchTab(this, 'deep')">深度分析</button>    <button class="tab" onclick="switchTab(this, 'trend')">趋势追踪</button>
            </div>
            <div id="keywords-panel">    <div class="form-row">        <div class="input-group" style="flex: 2;"><label>搜索关键词</label><input type="text" id="keywords" placeholder="例如: AI, Python教程, 科技新闻">        </div>        <div class="input-group"><label>时间范围</label><select id="time-range">    <option value="today">今天</option>    <option value="this_week">本周</option>    <option value="this_month" selected>本月</option>    <option value="past_year">过去一年</option></select>        </div>    </div>    <div class="form-row">        <div class="input-group"><label>排序方式</label><select id="sort-order">    <option value="relevance">相关性</option>    <option value="date">发布时间</option>    <option value="viewCount" selected>播放量</option>    <option value="rating">评分</option></select>        </div>        <div class="input-group"><label>结果数量</label><select id="max-results">    <option value="10">10</option>    <option value="20" selected>20</option>    <option value="30">30</option>    <option value="50">50</option></select>        </div>        <div class="input-group" style="flex: 0 0 auto; display: flex; align-items: flex-end;"><button class="btn-search" onclick="searchTrends()">🔍 搜索</button>        </div>    </div>    <div class="history-section" id="history-section" style="display: none;">        <div style="display: flex; justify-content: space-between; align-items: center;"><span class="history-label">最近搜索</span><button class="history-clear" onclick="clearHistory()">清除历史</button>        </div>        <div class="history-tags" id="history-tags"></div>    </div></div><div id="channel-panel" class="hidden">    <div class="form-row">        <div class="input-group" style="flex: 2;"><label>频道 ID 或 URL</label><input type="text" id="channel-input" placeholder="例如: UCXuqS4H64fpLVoXrLhKyQQg 或 https://youtube.com/channel/UC...">        </div>        <div class="input-group"><label>时间范围</label><select id="channel-time-range">    <option value="past_year" selected>过去一年</option>    <option value="past_month">本月</option>    <option value="this_week">本周</option></select>        </div>        <div class="input-group"><label>排序方式</label><select id="channel-sort">    <option value="date" selected>发布时间</option>    <option value="viewCount">播放量</option>    <option value="rating">评分</option></select>        </div>        <div class="input-group" style="flex: 0 0 auto; display: flex; align-items: flex-end;"><button class="btn-search" onclick="searchChannel()">📊 分析</button>        </div>    </div></div></div>
        </div>
        <div id="compare-panel" class="hidden"><div class="form-row">    <div class="input-group">        <label>搜索关键词 1</label>        <input type="text" id="compare-query1" placeholder="例如: AI">    </div>    <div class="input-group">        <label>搜索关键词 2</label>        <input type="text" id="compare-query2" placeholder="例如: Python教程">    </div></div><div class="form-row">    <div class="input-group" style="flex: 0 0 auto;">        <button class="btn-search" onclick="compareSearches()">📊 对比分析</button>    </div></div>
        <div id="batch-panel" class="hidden"><div class="form-row">    <div class="input-group" style="flex: 3;">        <label>关键词列表（逗号分隔）</label>        <input type="text" id="batch-keywords" placeholder="例如: 健身, 烹饪, 科技, 游戏, 美食, 搞笑">    </div>    <div class="input-group" style="flex: 1;">        <label>时间范围</label>        <select id="batch-time-range"><option value="this_week">本周</option><option value="this_month" selected>本月</option><option value="past_year">过去一年</option>        </select>    </div>    <div class="input-group" style="flex: 1;">        <label>每个关键词结果数</label>        <select id="batch-max-results"><option value="10">10</option><option value="20" selected>20</option><option value="30">30</option>        </select>    </div></div><div class="form-row">    <div class="input-group" style="flex: 0 0 auto;">        <button class="btn-search" onclick="batchScan()">📊 开始扫描</button>    </div></div><div id="batch-scan-results" class="hidden" style="margin-top: 24px;">    <h2 style="margin-bottom: 16px; font-size: 18px;">📊 批量扫描结果</h2>    <div id="batch-table" style="margin-top: 20px;"></div></div>
        </div>
        <div id="hot-panel" class="hidden"><div class="form-row">    <div class="input-group">        <label>时间范围</label>        <select id="hot-time-range"><option value="this_week">本周</option><option value="this_month" selected>本月</option><option value="past_year">过去一年</option>        </select>    </div>    <div class="input-group">        <label>显示类别数</label>        <select id="hot-max-count"><option value="10" selected>10</option><option value="15">15</option><option value="20">20</option>        </select>    </div>    <div class="input-group" style="flex: 0 0 auto;">        <button class="btn-search" onclick="loadHotCategories()">📊 扫描类别</button>    </div></div><div id="hot-results" class="hidden" style="margin-top: 24px;">    <h2 style="margin-bottom: 16px; font-size: 18px;">🏆 热门 Shorts 类别排名</h2>    <div class="chart-card">        <div class="chart-container" style="height: 400px;"><canvas id="hot-chart"></canvas>        </div>    </div>    <div id="hot-table" style="margin-top: 20px;"></div></div>
        </div>
        <div id="feature-panel" class="hidden"><div class="form-row">    <div class="input-group" style="flex: 2;">        <label>分析关键词</label>        <input type="text" id="feature-keyword" placeholder="例如: AI">    </div>    <div class="input-group" style="flex: 1;">        <label>时间范围</label>        <select id="feature-time-range"><option value="this_week">本周</option><option value="this_month" selected>本月</option><option value="past_year">过去一年</option>        </select>    </div>    <div class="input-group" style="flex: 1;">        <label>分析视频数</label>        <select id="feature-max-results"><option value="10">10</option><option value="20" selected>20</option><option value="30">30</option>        </select>    </div></div><div class="form-row">    <div class="input-group" style="flex: 0 0 auto;">        <button class="btn-search" onclick="analyzeFeatures()">🔍 分析特征</button>    </div></div><div id="feature-result" class="hidden" style="margin-top: 20px;"></div>
        </div>
        <div id="deep-panel" class="hidden"><div style="display:grid; grid-template-columns: 1fr 1fr; gap:24px;">    <div>        <h3 style="margin-bottom:12px;color:#ccc;">关键词深度分析</h3>        <div class="form-row"><div class="input-group" style="flex:2;">    <label>关键词</label>    <input type="text" id="deep-keyword" placeholder="例如: AI教程"></div><div class="input-group" style="flex:1;">    <label>视频数</label>    <select id="deep-max-results">        <option value="20">20</option>        <option value="30" selected>30</option>        <option value="50">50</option>    </select></div><div class="input-group" style="flex:1;">    <label>时间范围</label>    <select id="deep-time-range">        <option value="this_week">本周</option>        <option value="this_month" selected>本月</option>        <option value="past_year">过去一年</option>    </select></div><div class="input-group" style="flex:0 0 auto; display:flex; align-items:flex-end;">    <button class="btn-search" onclick="analyzeShortsDetailed()">🔍 分析</button></div>        </div>        <div id="deep-result" style="margin-top:16px;"></div>    </div>    <div>        <h3 style="margin-bottom:12px;color:#ccc;">频道 Shorts 分析</h3>        <div class="form-row"><div class="input-group" style="flex:2;">    <label>频道 ID</label>    <input type="text" id="channel-insights-id" placeholder="UC..."></div><div class="input-group" style="flex:1;">    <label>时间范围</label>    <select id="channel-insights-time">        <option value="past_month">本月</option>        <option value="past_year" selected>过去一年</option>    </select></div><div class="input-group" style="flex:0 0 auto; display:flex; align-items:flex-end;">    <button class="btn-search" onclick="getChannelInsights()">📊 分析</button></div>        </div>        <div id="channel-insights-result" style="margin-top:16px;"></div>    </div></div>
        </div>
        <div id="trend-panel" class="hidden"><div class="form-row">    <div class="input-group" style="flex: 2;">        <label>关键词</label>        <input type="text" id="trend-keyword" placeholder="输入关键词追踪趋势">    </div>    <div class="input-group">        <label>时间范围</label>        <select id="trend-time-range"><option value="past_year" selected>过去一年</option><option value="past_2years">近两年</option><option value="past_5years">近五年</option>        </select>    </div>    <div class="input-group" style="flex: 0 0 auto;">        <button class="btn-search" onclick="trackTrend()">📈 追踪</button>    </div></div><div id="trend-result" class="hidden" style="margin-top: 20px;"></div>
        </div>
        <div id="loading" class="loading hidden">正在分析<span></span></div>
        <div id="results" class="hidden"><div class="toolbar">    <button class="btn-tool" onclick="copyResults()">📋 复制结果</button>    <button class="btn-tool" onclick="exportJSON()">💾 导出 JSON</button>    <button class="btn-tool" onclick="exportCSV()">📊 导出 CSV</button></div><div class="stats-grid">    <div class="stat-card"><div class="stat-value" id="stat-videos">-</div><div class="stat-label">视频总数</div></div>    <div class="stat-card"><div class="stat-value" id="stat-views">-</div><div class="stat-label">平均播放量</div></div>    <div class="stat-card"><div class="stat-value" id="stat-likes">-</div><div class="stat-label">平均点赞数</div></div>    <div class="stat-card"><div class="stat-value" id="stat-comments">-</div><div class="stat-label">平均评论数</div></div>    <div class="stat-card"><div class="stat-value" id="stat-freq">-</div><div class="stat-label">月均发布</div></div></div><div class="chart-section">    <div class="chart-card"><h3>📈 播放量趋势</h3><div class="chart-container"><canvas id="views-chart"></canvas></div></div>    <div class="chart-card"><h3>🏷️ 热门标签</h3><div class="tag-cloud" id="tags-cloud"></div></div></div><div class="chart-section">    <div class="chart-card"><h3>💬 互动率分布</h3><div class="chart-container"><canvas id="engagement-chart"></canvas></div></div>    <div class="chart-card"><h3>📊 数据对比</h3><div class="chart-container"><canvas id="compare-chart"></canvas></div></div></div><h2 style="margin: 24px 0 16px; font-size: 18px;">🎬 热门视频</h2><div class="video-grid" id="video-grid"></div>
        </div>
        <div id="empty" class="empty"><div class="empty-icon">📺</div><p>输入关键词或频道 ID 开始分析</p>
        </div>
    </div>
        <div id="comparison-result" class="comparison-result hidden"><h3 style="margin-bottom: 16px;">📊 对比结果</h3><div id="comparison-content"></div>
        </div>
    <script>
        let viewsChart = null, engagementChart = null, compareChart = null, currentData = null;
        function toggleTheme() {document.body.classList.toggle('light');const isLight = document.body.classList.contains('light');localStorage.setItem('theme', isLight ? 'light' : 'dark');document.querySelector('.theme-toggle').textContent = isLight ? '☀️ 主题' : '🌙 主题';
        }
        (function() {const t = localStorage.getItem('theme');if (t === 'light') { document.body.classList.add('light'); document.querySelector('.theme-toggle').textContent = '☀️ 主题'; }
        })();
        function loadHistory() {const history = JSON.parse(localStorage.getItem('searchHistory') || '[]');const section = document.getElementById('history-section');const tags = document.getElementById('history-tags');if (!history.length) { section.style.display = 'none'; return; }section.style.display = 'block';tags.innerHTML = history.slice(-5).reverse().map(h => `<span class="history-tag" onclick="useHistory('${h.replace(/'/g, "\\'")}')">${h}</span>`).join('');
        }

        async function trackTrend() {const kw = document.getElementById('trend-keyword').value.trim();if (!kw) { alert('请输入关键词'); return; }const loading = document.getElementById('loading'), results = document.getElementById('trend-result');loading.classList.remove('hidden'); results.classList.add('hidden');try {    const resp = await fetch(`/api/trends/track?keyword=${encodeURIComponent(kw)}&time_range=${document.getElementById('trend-time-range').value}`);    if (!resp.ok) { const e = await resp.json(); throw new Error(e.detail || '请求失败'); }    const data = await resp.json();    renderTrendResults(data);    results.classList.remove('hidden');} catch (e) { alert('追踪失败: ' + e.message); }finally { loading.classList.add('hidden'); }
        }
        function renderTrendResults(data) {const lc = document.body.classList.contains('light');const tc = lc ? '#666' : '#888', gc = lc ? '#e0e0e0' : '#333';let html = '<div class="chart-card"><h3>趋势变化</h3><div class="chart-container" style="height:300px;"><canvas id="trend-chart"></canvas></div></div>';if (data.snapshots?.length) {    html += '<div style="margin-top:20px;"><h3>历史记录</h3><div style="margin-top:12px;">';    data.snapshots.forEach(s => {        html += `<div style="padding: 8px 0; border-bottom: 1px solid #333; font-size: 13px;"><span style="color: #888;">${new Date(s.recorded_at).toLocaleString()}</span><span style="float: right; color: #00ff88;">${formatNumber(Math.round(s.avg_views))} 播放</span><span style="float: right; margin-right: 12px; color: #888;">${s.total_videos} 视频</span>        </div>`;    }).reverse().join('') : '<div style="color: #666; padding: 12px;">暂无历史记录，点击"强制刷新"获取首次数据</div>';    html += '</div></div>';}document.getElementById('trend-result').innerHTML = html;setTimeout(() => {    const ctx = document.getElementById('trend-chart').getContext('2d');    if (window.trendChart) window.trendChart.destroy();    window.trendChart = new Chart(ctx, {        type: 'line',        data: { labels: data.dates, datasets: [{ label:'平均播放量', data: data.avg_views, borderColor: '#ff0000', backgroundColor: 'rgba(255,0,0,0.1)', tension: 0.4, fill: true }, { label:'视频数', data: data.video_count, borderColor: '#00ff88', backgroundColor: 'rgba(0,255,136,0.1)', tension: 0.4, fill: false, yAxisID: 'y1' }] },        options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:tc}}}, scales:{y:{beginAtZero:true,ticks:{color:tc,callback:v=>formatNumber(v)},grid:{color:gc}},y1:{position:'right',beginAtZero:true,ticks:{color:'#00ff88'},grid:{display:false}},x:{ticks:{color:tc},grid:{color:gc}}}}    });}, 100);
        }
        document.getElementById('deep-keyword').addEventListener('keypress',e=>{if(e.key==='Enter')analyzeShortsDetailed();});
        document.getElementById('channel-insights-id').addEventListener('keypress',e=>{if(e.key==='Enter')getChannelInsights();});
        document.getElementById('trend-keyword').addEventListener('keypress',e=>{if(e.key==='Enter')trackTrend();});


    </script>
</body>
</html>
